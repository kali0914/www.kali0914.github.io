<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS 服务器状态监控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0b0e14;
            color: #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #151b23;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            border: 1px solid #2a333d;
        }
        h1 {
            text-align: center;
            color: #ffb443;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 180, 67, 0.3);
        }
        .subtitle {
            text-align: center;
            color: #6a7a8a;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .search-box input {
            flex: 1;
            padding: 12px 18px;
            background: #1e2730;
            border: 1px solid #2f3b47;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            min-width: 200px;
        }
        .search-box input:focus {
            border-color: #ffb443;
            box-shadow: 0 0 12px rgba(255, 180, 67, 0.2);
        }
        .search-box button {
            padding: 12px 28px;
            background: #ffb443;
            color: #0b0e14;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .search-box button:hover {
            background: #ffa825;
            transform: scale(1.03);
        }
        .server-card {
            background: #1e2730;
            border-radius: 12px;
            padding: 20px;
            border-left: 6px solid #ffb443;
            margin-bottom: 20px;
            display: none;
        }
        .server-card.active {
            display: block;
        }
        .server-name {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }
        .server-details {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 15px;
            color: #aab9c9;
            margin-bottom: 15px;
        }
        .server-details span {
            background: #10171f;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #2f3b47;
        }
        .player-title {
            margin-top: 10px;
            font-weight: bold;
            color: #8ea4b8;
            border-bottom: 1px solid #2f3b47;
            padding-bottom: 6px;
        }
        .player-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
        }
        .player-tag {
            background: #10171f;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 14px;
            color: #c8d6e5;
            border: 1px solid #2f3b47;
        }
        .error-msg {
            color: #f87171;
            text-align: center;
            padding: 30px;
            display: none;
        }
        .error-msg.active {
            display: block;
        }
        .loading {
            text-align: center;
            color: #ffb443;
            display: none;
        }
        .loading.active {
            display: block;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #4a5a6a;
            font-size: 13px;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #151b23;
        }
        ::-webkit-scrollbar-thumb {
            background: #ffb443;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ CS 服务器监控</h1>
        <p class="subtitle">输入 IP:端口 查询实时状态 (默认端口 27015)</p>

        <div class="search-box">
            <input type="text" id="serverInput" placeholder="例如: 45.137.245.25:27015" value="45.137.245.25:27015" />
            <button onclick="queryServer()">🔍 查询状态</button>
        </div>

        <div id="loading" class="loading">🔄 正在连接服务器...</div>
        <div id="errorMsg" class="error-msg">❌ 无法连接，请检查IP是否正确</div>

        <div id="serverCard" class="server-card">
            <div class="server-name" id="svName">-</div>
            <div class="server-details">
                <span>📍 地图: <strong id="svMap">-</strong></span>
                <span>👥 玩家: <strong id="svPlayers">0</strong> / <span id="svMax">0</span></span>
                <span>📶 延迟: <strong id="svPing">0</strong> ms</span>
            </div>
            <div class="player-title">🎯 在线玩家名单</div>
            <div id="playerList" class="player-list">
                <span class="player-tag">暂无玩家在线</span>
            </div>
        </div>
        <div class="footer">Made with ❤️ · 数据实时查询</div>
    </div>

    <script>
        // ============================================================
        // ！！！重要：将下面这行 URL 替换为您实际的 Cloudflare Worker 地址
        // ============================================================
        const WORKER_API = 'https://dbcs.13437902804.workers.dev';

        async function queryServer() {
            const input = document.getElementById('serverInput').value.trim();
            let host = input;
            let port = 27015;

            if (input.includes(':')) {
                const parts = input.split(':');
                host = parts[0];
                port = parseInt(parts[1]) || 27015;
            }

            const card = document.getElementById('serverCard');
            const error = document.getElementById('errorMsg');
            const loading = document.getElementById('loading');

            card.classList.remove('active');
            error.classList.remove('active');
            loading.classList.add('active');

            try {
                const response = await fetch(`${WORKER_API}?host=${host}&port=${port}`);
                const result = await response.json();

                loading.classList.remove('active');

                if (result.success) {
                    const d = result.data;
                    document.getElementById('svName').textContent = d.name || '未命名服务器';
                    document.getElementById('svMap').textContent = d.map || '未知';
                    document.getElementById('svPlayers').textContent = d.players;
                    document.getElementById('svMax').textContent = d.maxPlayers;
                    document.getElementById('svPing').textContent = d.ping || '0';

                    const listContainer = document.getElementById('playerList');
                    listContainer.innerHTML = '';
                    if (d.list && d.list.length > 0) {
                        d.list.forEach(name => {
                            const tag = document.createElement('span');
                            tag.className = 'player-tag';
                            tag.textContent = name;
                            listContainer.appendChild(tag);
                        });
                    } else {
                        listContainer.innerHTML = '<span class="player-tag">🕊️ 服务器空闲中...</span>';
                    }

                    card.classList.add('active');
                } else {
                    error.textContent = '❌ ' + (result.message || '查询失败，请重试');
                    error.classList.add('active');
                }
            } catch (e) {
                loading.classList.remove('active');
                error.textContent = '❌ 网络请求失败，请检查Worker地址是否正确';
                error.classList.add('active');
                console.error(e);
            }
        }

        // 页面加载后自动查询默认服务器
        window.onload = function() {
            queryServer();
        };
    </script>
</body>
</html>
