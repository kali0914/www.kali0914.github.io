<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>高德地图 · 天气 + 全功能</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 顶部导航 ===== */
        .header {
            flex-shrink: 0;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: #fff;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(26, 115, 232, 0.35);
            z-index: 10;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 small {
            font-size: 13px;
            font-weight: 400;
            opacity: 0.85;
        }

        .header .status-badge {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .status-badge .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse-dot 1.8s infinite;
        }

        .status-badge .dot.inactive {
            background: #ff9800;
            animation: none;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        /* ===== 地图容器 ===== */
        #container {
            flex: 1;
            width: 100%;
            min-height: 0;
            position: relative;
            background: #e8edf3;
        }

        /* ===== 地图工具栏 (搜索 + 经纬度) ===== */
        .map-toolbar {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 12px 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: auto;
            max-width: 96%;
            pointer-events: auto;
            transition: all 0.2s;
        }

        .map-toolbar .group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .map-toolbar .group-label {
            font-size: 12px;
            color: #5f6b7a;
            font-weight: 500;
            margin-right: 2px;
        }

        .map-toolbar input {
            border: 1px solid #d9e1ec;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            background: #f8fafc;
            outline: none;
            transition: border 0.2s;
            width: 120px;
            min-width: 80px;
        }

        .map-toolbar input:focus {
            border-color: #1a73e8;
            background: #fff;
        }

        .map-toolbar input.coord-input {
            width: 90px;
        }

        .map-toolbar button {
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .map-toolbar button:hover {
            background: #1557b0;
            transform: scale(1.02);
        }

        .map-toolbar button:active {
            transform: scale(0.95);
        }

        .map-toolbar .divider {
            width: 1px;
            height: 28px;
            background: #e0e6ef;
            flex-shrink: 0;
        }

        /* ===== 地图底部控制 ===== */
        .map-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 0 16px;
            pointer-events: none;
            z-index: 20;
            flex-wrap: wrap;
        }

        .map-controls .btn-group {
            display: flex;
            gap: 10px;
            pointer-events: auto;
            flex-wrap: wrap;
            justify-content: center;
        }

        .map-controls button {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border: none;
            border-radius: 30px;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 500;
            color: #1a2332;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
            user-select: none;
        }

        .map-controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
            background: #ffffff;
        }

        .map-controls button:active {
            transform: scale(0.95);
        }

        .map-controls button .icon {
            font-size: 18px;
            line-height: 1;
        }

        .map-controls button.primary {
            background: #1a73e8;
            color: #fff;
            border-color: #1a73e8;
        }

        .map-controls button.primary:hover {
            background: #1557b0;
            border-color: #1557b0;
        }

        /* ===== 图层切换菜单 (右上) ===== */
        .layer-menu {
            position: absolute;
            top: 80px;
            right: 16px;
            z-index: 25;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 10px 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
            min-width: 110px;
        }

        .layer-menu .menu-title {
            font-size: 12px;
            font-weight: 600;
            color: #3c4a5a;
            padding-bottom: 4px;
            border-bottom: 1px solid #eef2f7;
            margin-bottom: 4px;
        }

        .layer-menu label {
            font-size: 13px;
            color: #1a2332;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 2px 0;
        }

        .layer-menu input[type="radio"] {
            accent-color: #1a73e8;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* ===== 天气卡片 (右上) ===== */
        .weather-card {
            position: absolute;
            top: 80px;
            right: 16px;
            z-index: 26;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            min-width: 150px;
            pointer-events: none;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(-8px) scale(0.96);
            margin-bottom: 8px;
        }

        .weather-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .weather-card .city {
            font-size: 14px;
            font-weight: 600;
            color: #1a2332;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .weather-card .weather-main {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .weather-card .temp {
            font-size: 24px;
            font-weight: 700;
            color: #1a73e8;
        }

        .weather-card .desc {
            font-size: 14px;
            color: #3c4a5a;
        }

        .weather-card .extra {
            font-size: 12px;
            color: #6b7a8f;
            margin-top: 4px;
        }

        .weather-card .loading-text {
            color: #6b7a8f;
            font-size: 13px;
            text-align: center;
            padding: 4px 0;
        }

        /* ===== 信息卡片 ===== */
        .info-card {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 14px 22px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.13);
            border: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 20;
            max-width: 92%;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            transform: translateX(-50%) translateY(-12px) scale(0.96);
            text-align: center;
        }

        .info-card.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .info-card .title {
            font-size: 13px;
            font-weight: 600;
            color: #1a73e8;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .info-card .address {
            font-size: 15px;
            font-weight: 500;
            color: #1a2332;
            word-break: break-all;
        }

        .info-card .coords {
            font-size: 12px;
            color: #6b7a8f;
            margin-top: 3px;
            font-family: "SF Mono", "Menlo", monospace;
        }

        /* ===== 版权 ===== */
        .footer-credit {
            position: absolute;
            bottom: 90px;
            right: 16px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 15;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* ===== 加载遮罩 ===== */
        .loading-mask {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(2px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .loading-mask.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-mask .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(26, 115, 232, 0.15);
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        .loading-mask p {
            margin-top: 16px;
            color: #1a2332;
            font-size: 15px;
            font-weight: 500;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== 响应式调整 ===== */
        @media (max-width: 760px) {
            .map-toolbar {
                top: 12px;
                padding: 10px 12px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                width: 96%;
            }
            .map-toolbar .group {
                justify-content: center;
            }
            .map-toolbar input {
                width: 100px;
            }
            .map-toolbar input.coord-input {
                width: 70px;
            }
            .map-toolbar .divider {
                display: none;
            }
            .layer-menu {
                top: 170px;
                right: 8px;
                padding: 8px 12px;
                min-width: 90px;
            }
            .weather-card {
                top: 170px;
                right: 8px;
                min-width: 120px;
                padding: 10px 12px;
            }
            .weather-card .temp {
                font-size: 20px;
            }
            .header h1 {
                font-size: 17px;
            }
            .header h1 small {
                font-size: 11px;
                display: none;
            }
            .header .status-badge {
                font-size: 12px;
                padding: 4px 12px;
            }
            .map-controls button {
                padding: 8px 16px;
                font-size: 13px;
            }
            .map-controls button .icon {
                font-size: 16px;
            }
            .info-card {
                top: 165px;
                padding: 12px 16px;
                max-width: 96%;
            }
            .info-card .address {
                font-size: 14px;
            }
            .footer-credit {
                bottom: 80px;
                right: 10px;
                font-size: 10px;
            }
        }

        @media (max-width: 420px) {
            .header {
                padding: 10px 14px;
            }
            .map-toolbar input {
                width: 80px;
                font-size: 12px;
                padding: 4px 10px;
            }
            .map-toolbar input.coord-input {
                width: 60px;
            }
            .map-toolbar button {
                font-size: 12px;
                padding: 4px 12px;
            }
            .map-controls {
                bottom: 16px;
                gap: 6px;
            }
            .map-controls .btn-group {
                gap: 6px;
            }
            .map-controls button {
                padding: 6px 12px;
                font-size: 12px;
                border-radius: 24px;
            }
            .layer-menu {
                top: 180px;
                right: 6px;
                padding: 6px 10px;
                min-width: 80px;
            }
            .layer-menu label {
                font-size: 12px;
            }
            .weather-card {
                top: 180px;
                right: 6px;
                min-width: 100px;
                padding: 8px 10px;
            }
            .weather-card .temp {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 顶部导航 ===== -->
    <header class="header">
        <h1>
            🗺️ 地图测试
            <small>IP定位 + 天气</small>
        </h1>
        <div class="status-badge">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">加载中</span>
        </div>
    </header>

    <!-- ===== 地图容器 ===== -->
    <div id="container">
        <!-- 加载遮罩 -->
        <div class="loading-mask" id="loadingMask">
            <div class="spinner"></div>
            <p>地图加载中 …</p>
        </div>

        <!-- ===== 地图工具栏 (搜索 + 经纬度) ===== -->
        <div class="map-toolbar" id="mapToolbar">
            <div class="group">
                <span class="group-label">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索地点..." />
                <button id="searchBtn">搜索</button>
            </div>
            <div class="divider"></div>
            <div class="group">
                <span class="group-label">📍</span>
                <input type="number" id="lngInput" class="coord-input" placeholder="经度" step="any" />
                <input type="number" id="latInput" class="coord-input" placeholder="纬度" step="any" />
                <button id="locateCoordBtn">定位</button>
            </div>
        </div>

        <!-- ===== 图层切换菜单 (右上) ===== -->
        <div class="layer-menu" id="layerMenu">
            <div class="menu-title">图层切换</div>
            <label><input type="radio" name="layer" value="default" checked /> 标准</label>
            <label><input type="radio" name="layer" value="satellite" /> 卫星</label>
            <label><input type="radio" name="layer" value="roadnet" /> 路网</label>
            <label><input type="radio" name="layer" value="traffic" /> 实时交通</label>
            <label><input type="radio" name="layer" value="buildings" /> 3D楼块</label>
        </div>

        <!-- ===== 天气卡片 (右上) ===== -->
        <div class="weather-card" id="weatherCard">
            <div class="city" id="weatherCity">🌍 获取中...</div>
            <div class="weather-main">
                <span class="temp" id="weatherTemp">--°C</span>
                <span class="desc" id="weatherDesc">--</span>
            </div>
            <div class="extra" id="weatherExtra">风力 · 湿度</div>
        </div>

        <!-- ===== 信息卡片 ===== -->
        <div class="info-card" id="infoCard">
            <div class="title">📍 当前位置</div>
            <div class="address" id="addressDisplay">—</div>
            <div class="coords" id="coordsDisplay">—</div>
        </div>

        <!-- ===== 底部控制按钮 ===== -->
        <div class="map-controls">
            <div class="btn-group">
                <button id="btnLocate" class="primary">
                    <span class="icon">📌</span> 我的位置
                </button>
                <button id="btnZoomIn">
                    <span class="icon">➕</span> 放大
                </button>
                <button id="btnZoomOut">
                    <span class="icon">➖</span> 缩小
                </button>
                <button id="btnReset">
                    <span class="icon">🔄</span> 重置
                </button>
            </div>
        </div>

        <!-- ===== 版权 ===== -->
        <div class="footer-credit">© 高德地图 · IP定位 + 天气</div>
    </div>

    <!-- ============================================================ -->
    <!-- 高德地图 JS API (插件: Geolocation, PlaceSearch, Weather, Geocoder) -->
    <!-- ============================================================ -->
    <script src="https://webapi.amap.com/maps?v=2.0&key=23c5ccc4798b2059e1929a23280d7d56&plugin=AMap.Geolocation,AMap.PlaceSearch,AMap.Weather,AMap.Geocoder">
    </script>

    <script>
        (function() {
            'use strict';

            // ---------- DOM 引用 ----------
            const container = document.getElementById('container');
            const loadingMask = document.getElementById('loadingMask');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const infoCard = document.getElementById('infoCard');
            const addressDisplay = document.getElementById('addressDisplay');
            const coordsDisplay = document.getElementById('coordsDisplay');

            const btnLocate = document.getElementById('btnLocate');
            const btnZoomIn = document.getElementById('btnZoomIn');
            const btnZoomOut = document.getElementById('btnZoomOut');
            const btnReset = document.getElementById('btnReset');

            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const lngInput = document.getElementById('lngInput');
            const latInput = document.getElementById('latInput');
            const locateCoordBtn = document.getElementById('locateCoordBtn');

            const layerRadios = document.querySelectorAll('input[name="layer"]');

            // 天气卡片元素
            const weatherCard = document.getElementById('weatherCard');
            const weatherCity = document.getElementById('weatherCity');
            const weatherTemp = document.getElementById('weatherTemp');
            const weatherDesc = document.getElementById('weatherDesc');
            const weatherExtra = document.getElementById('weatherExtra');

            // ---------- 状态 ----------
            let map = null;
            let placeSearch = null;
            let weatherPlugin = null;
            let geocoder = null;
            let marker = null; // 当前位置标记 (IP定位)
            let circle = null;
            let tempMarker = null; // 搜索或经纬度定位的临时标记
            let tempInfoWindow = null;
            let isFirstLocate = true;

            // 当前IP定位信息
            let currentIpCity = '';
            let currentIpLng = 0;
            let currentIpLat = 0;

            const DEFAULT_CENTER = [116.397428, 39.90923];
            const DEFAULT_ZOOM = 14;

            // ---------- 图层管理 ----------
            let currentLayers = {
                default: null,
                satellite: null,
                roadnet: null,
                traffic: null,
                buildings: null,
            };
            let activeLayerKey = 'default';

            function initLayers() {
                currentLayers.default = new AMap.TileLayer();
                currentLayers.satellite = new AMap.TileLayer.Satellite();
                currentLayers.roadnet = new AMap.TileLayer.RoadNet();
                currentLayers.traffic = new AMap.TileLayer.Traffic({
                    autoRefresh: true,
                    interval: 180,
                });
                currentLayers.buildings = new AMap.Buildings({
                    heightFactor: 1,
                    buildingShadow: true,
                });
            }

            function switchLayer(key) {
                if (!map) return;
                const allLayers = Object.values(currentLayers).filter(l => l !== null);
                map.remove(allLayers);
                const layer = currentLayers[key];
                if (layer) {
                    map.add(layer);
                    activeLayerKey = key;
                } else {
                    map.add(currentLayers.default);
                    activeLayerKey = 'default';
                }
            }

            // ---------- 状态栏 ----------
            function setStatus(active, text) {
                if (active) {
                    statusDot.className = 'dot';
                } else {
                    statusDot.className = 'dot inactive';
                }
                statusText.textContent = text;
            }

            // ---------- 信息卡片 ----------
            function showInfoCard(address, lng, lat) {
                addressDisplay.textContent = address || '未知地址';
                coordsDisplay.textContent = `经度 ${lng.toFixed(6)}  ·  纬度 ${lat.toFixed(6)}`;
                infoCard.classList.add('visible');
            }

            function hideInfoCard() {
                infoCard.classList.remove('visible');
            }

            // ---------- 清除临时标记 ----------
            function clearTempMarker() {
                if (tempMarker) {
                    map.remove(tempMarker);
                    tempMarker = null;
                }
                if (tempInfoWindow) {
                    map.remove(tempInfoWindow);
                    tempInfoWindow = null;
                }
            }

            // ---------- 添加临时标记 ----------
            function addTempMarker(lng, lat, title, content) {
                clearTempMarker();
                tempMarker = new AMap.Marker({
                    position: [lng, lat],
                    title: title || '定位点',
                    animation: 'AMAP_ANIMATION_DROP',
                });
                map.add(tempMarker);
                map.setCenter([lng, lat]);
                map.setZoom(16);

                tempInfoWindow = new AMap.InfoWindow({
                    content: content || `<div style="padding:4px 8px;font-size:14px;">${title || '位置'}</div>`,
                    offset: new AMap.Pixel(0, -30),
                });
                tempInfoWindow.open(map, tempMarker.getPosition());

                showInfoCard(title || '自定义位置', lng, lat);
            }

            // ---------- 天气相关 ----------
            function showWeatherCard(city, temp, weather, wind, humidity) {
                weatherCity.textContent = `🌍 ${city}`;
                weatherTemp.textContent = `${temp}°C`;
                weatherDesc.textContent = weather || '--';
                weatherExtra.textContent = `${wind || '--'} · 湿度 ${humidity || '--'}%`;
                weatherCard.classList.add('visible');
            }

            function showWeatherLoading() {
                weatherCard.classList.add('visible');
                weatherCity.textContent = '⏳ 查询天气...';
                weatherTemp.textContent = '--°C';
                weatherDesc.textContent = '--';
                weatherExtra.textContent = '加载中';
            }

            function hideWeatherCard() {
                weatherCard.classList.remove('visible');
            }

            // 查询天气 (通过城市名或adcode)
            function fetchWeather(cityName) {
                if (!weatherPlugin) {
                    console.warn('天气插件未就绪');
                    return;
                }
                if (!cityName || cityName.trim() === '') {
                    weatherCard.classList.remove('visible');
                    return;
                }
                showWeatherLoading();
                weatherPlugin.getLive(cityName.trim(), function(status, result) {
                    if (status === 'complete' && result) {
                        const info = result;
                        showWeatherCard(
                            info.city || cityName,
                            info.temperature || '--',
                            info.weather || '--',
                            info.windDirection + info.windPower || '--',
                            info.humidity || '--'
                        );
                        console.log('[天气]', result);
                    } else {
                        // 可能城市名不对，尝试用adcode或者经纬度？
                        weatherCard.classList.remove('visible');
                        console.warn('[天气获取失败]', status, result);
                        // 显示简短错误
                        weatherCard.classList.add('visible');
                        weatherCity.textContent = '❌ 天气获取失败';
                        weatherTemp.textContent = '--°C';
                        weatherDesc.textContent = '--';
                        weatherExtra.textContent = '请尝试其他地点';
                    }
                });
            }

            // 通过坐标获取天气 (先逆地理编码获取城市名)
            function fetchWeatherByCoord(lng, lat) {
                if (!geocoder) {
                    console.warn('地理编码插件未就绪');
                    return;
                }
                geocoder.getAddress(new AMap.LngLat(lng, lat), function(status, result) {
                    if (status === 'complete' && result.info === 'OK') {
                        const address = result.regeocode;
                        const city = address.city || address.province || '';
                        if (city) {
                            fetchWeather(city);
                        } else {
                            // 没有城市信息，尝试用经纬度直接查询？高德天气不支持直接经纬度，就用默认
                            showWeatherCard('未知城市', '--', '无法获取天气', '', '');
                        }
                    } else {
                        console.warn('逆地理编码失败', result);
                        showWeatherCard('未知城市', '--', '无法获取天气', '', '');
                    }
                });
            }

            // ---------- IP定位 (ipapi.co) ----------
            function locateByIP() {
                setStatus(false, 'IP定位中...');
                fetch('https://ipapi.co/json/')
                    .then(response => {
                        if (!response.ok) throw new Error('IP定位服务请求失败');
                        return response.json();
                    })
                    .then(data => {
                        const city = data.city || data.region || '未知城市';
                        const lng = parseFloat(data.longitude) || 0;
                        const lat = parseFloat(data.latitude) || 0;
                        const country = data.country_name || '';

                        if (lng === 0 || lat === 0) {
                            throw new Error('IP定位返回无效坐标');
                        }

                        currentIpCity = city;
                        currentIpLng = lng;
                        currentIpLat = lat;

                        setStatus(true, `IP定位: ${city}`);
                        console.log('[IP定位]', data);

                        // 移除旧的定位标记
                        if (marker) {
                            map.remove(marker);
                            marker = null;
                        }
                        if (circle) {
                            map.remove(circle);
                            circle = null;
                        }

                        marker = new AMap.Marker({
                            position: [lng, lat],
                            icon: 'https://webapi.amap.com/theme/v1.3/markers/n/mark_b.png',
                            offset: new AMap.Pixel(-12, -34),
                            title: '我的位置 (IP)',
                            animation: 'AMAP_ANIMATION_DROP',
                        });
                        map.add(marker);
                        map.setCenter([lng, lat]);
                        if (isFirstLocate) {
                            map.setZoom(14);
                            isFirstLocate = false;
                        }

                        // 显示信息卡片
                        const addr = `${city}${country ? ', ' + country : ''}`;
                        showInfoCard(addr, lng, lat);

                        // 查询天气
                        if (city) {
                            fetchWeather(city);
                        } else {
                            fetchWeatherByCoord(lng, lat);
                        }

                        // 更新天气卡片城市名
                        if (city) {
                            weatherCity.textContent = `🌍 ${city}`;
                        }

                    })
                    .catch(error => {
                        console.error('IP定位失败:', error);
                        setStatus(false, 'IP定位失败');
                        // 降级到默认位置
                        if (isFirstLocate) {
                            isFirstLocate = false;
                            map.setCenter(DEFAULT_CENTER);
                            map.setZoom(DEFAULT_ZOOM);
                            showFallbackTip();
                        } else {
                            alert('IP定位失败，请检查网络或手动搜索位置。');
                        }
                    });
            }

            function showFallbackTip() {
                addressDisplay.textContent = '📍 IP定位失败，显示默认位置';
                coordsDisplay.textContent = '天安门广场 · 请检查网络';
                infoCard.classList.add('visible');
                setTimeout(() => {
                    infoCard.classList.remove('visible');
                }, 5000);
                // 尝试获取默认天气
                fetchWeather('北京');
            }

            // ---------- 搜索地点 ----------
            function searchPlace(keyword) {
                if (!keyword.trim()) {
                    alert('请输入搜索关键词');
                    return;
                }
                if (!placeSearch) {
                    alert('搜索插件未初始化');
                    return;
                }
                placeSearch.search(keyword, function(status, result) {
                    if (status === 'complete' && result.poiList && result.poiList.pois.length > 0) {
                        const poi = result.poiList.pois[0];
                        const lng = poi.location.getLng();
                        const lat = poi.location.getLat();
                        const name = poi.name || keyword;
                        const address = poi.address || '';
                        const full = name + (address ? ' (' + address + ')' : '');
                        addTempMarker(lng, lat, full, `<strong>${name}</strong><br>${address}`);
                        setStatus(true, '搜索成功');
                        // 查询天气（使用城市名或经纬度）
                        const city = poi.city || poi.adcode || '';
                        if (city) {
                            fetchWeather(city);
                        } else {
                            // 尝试用坐标逆地理获取城市
                            fetchWeatherByCoord(lng, lat);
                        }
                    } else {
                        alert('未找到该地点，请尝试其他关键词');
                        setStatus(false, '搜索无结果');
                    }
                });
            }

            // ---------- 经纬度定位 ----------
            function locateByCoord() {
                const lng = parseFloat(lngInput.value);
                const lat = parseFloat(latInput.value);
                if (isNaN(lng) || isNaN(lat)) {
                    alert('请输入有效的经度和纬度（数字）');
                    return;
                }
                if (lng < -180 || lng > 180 || lat < -90 || lat > 90) {
                    alert('经纬度超出合理范围');
                    return;
                }
                const title = `自定义坐标 (${lng.toFixed(6)}, ${lat.toFixed(6)})`;
                addTempMarker(lng, lat, title, `经度 ${lng.toFixed(6)}<br>纬度 ${lat.toFixed(6)}`);
                setStatus(true, '定位坐标成功');
                // 查询天气
                fetchWeatherByCoord(lng, lat);
            }

            // ---------- 重置视图 ----------
            function resetView() {
                map.setCenter(DEFAULT_CENTER);
                map.setZoom(DEFAULT_ZOOM);
                hideInfoCard();
                setStatus(true, '已重置');
                setTimeout(() => {
                    setStatus(true, '就绪');
                }, 1200);
                // 重置天气显示为默认城市（北京）
                fetchWeather('北京');
            }

            // ---------- 初始化地图 ----------
            function initMap() {
                if (typeof AMap === 'undefined') {
                    console.error('高德地图 API 未加载');
                    loadingMask.classList.add('hidden');
                    setStatus(false, '加载失败');
                    return;
                }

                map = new AMap.Map(container, {
                    zoom: DEFAULT_ZOOM,
                    center: DEFAULT_CENTER,
                    mapStyle: 'amap://styles/whitesmoke',
                    viewMode: '2D',
                    pitch: 0,
                    showIndoorMap: false,
                    zoomEnable: true,
                    dragEnable: true,
                    keyboardEnable: true,
                    resizeEnable: true,
                });

                initLayers();
                map.add(currentLayers.default);
                activeLayerKey = 'default';
                document.querySelector('input[name="layer"][value="default"]').checked = true;

                // 添加控件
                map.plugin(['AMap.Scale', 'AMap.ToolBar'], function() {
                    const scale = new AMap.Scale();
                    const toolbar = new AMap.ToolBar({
                        position: 'RT',
                        offset: new AMap.Pixel(10, 80),
                    });
                    map.addControl(scale);
                    map.addControl(toolbar);
                });

                // 初始化 PlaceSearch, Weather, Geocoder
                map.plugin(['AMap.PlaceSearch', 'AMap.Weather', 'AMap.Geocoder'], function() {
                    placeSearch = new AMap.PlaceSearch({
                        type: '全部',
                        city: '全国',
                        citylimit: false,
                        pageSize: 1,
                        pageIndex: 1,
                        extensions: 'all',
                    });
                    weatherPlugin = new AMap.Weather();
                    geocoder = new AMap.Geocoder({
                        city: '全国',
                        radius: 1000,
                        extensions: 'all',
                    });
                });

                // 地图加载完成
                map.on('complete', function() {
                    loadingMask.classList.add('hidden');
                    setStatus(true, '就绪');
                    console.log('[地图] 加载完成');

                    // 使用IP定位
                    locateByIP();

                    // 绑定地图点击事件
                    map.on('click', function(e) {
                        const lng = e.lnglat.getLng();
                        const lat = e.lnglat.getLat();
                        // 逆地理编码获取地址和城市
                        if (geocoder) {
                            geocoder.getAddress(new AMap.LngLat(lng, lat), function(status, result) {
                                if (status === 'complete' && result.info === 'OK') {
                                    const address = result.regeocode;
                                    const city = address.city || address.province || '';
                                    const formatted = address.formattedAddress || '未知地址';
                                    addTempMarker(lng, lat, formatted, `<strong>${formatted}</strong>`);
                                    // 查询天气
                                    if (city) {
                                        fetchWeather(city);
                                    } else {
                                        fetchWeatherByCoord(lng, lat);
                                    }
                                } else {
                                    addTempMarker(lng, lat, `坐标 (${lng.toFixed(6)}, ${lat.toFixed(6)})`, '');
                                    fetchWeatherByCoord(lng, lat);
                                }
                            });
                        } else {
                            addTempMarker(lng, lat, `坐标 (${lng.toFixed(6)}, ${lat.toFixed(6)})`, '');
                            fetchWeatherByCoord(lng, lat);
                        }
                    });
                });

                map.on('error', function(e) {
                    loadingMask.classList.add('hidden');
                    setStatus(false, '地图错误');
                    console.error('[地图错误]', e);
                });
            }

            // ---------- 事件绑定 ----------
            function bindEvents() {
                // IP定位 (我的位置)
                btnLocate.addEventListener('click', function() {
                    locateByIP();
                });

                btnZoomIn.addEventListener('click', function() {
                    if (map) {
                        const zoom = map.getZoom();
                        map.setZoom(Math.min(zoom + 1, 20));
                    }
                });
                btnZoomOut.addEventListener('click', function() {
                    if (map) {
                        const zoom = map.getZoom();
                        map.setZoom(Math.max(zoom - 1, 3));
                    }
                });

                btnReset.addEventListener('click', resetView);

                searchBtn.addEventListener('click', function() {
                    searchPlace(searchInput.value);
                });
                searchInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        searchPlace(searchInput.value);
                    }
                });

                locateCoordBtn.addEventListener('click', locateByCoord);
                lngInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        locateByCoord();
                    }
                });
                latInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        locateByCoord();
                    }
                });

                layerRadios.forEach(radio => {
                    radio.addEventListener('change', function() {
                        if (this.checked) {
                            switchLayer(this.value);
                        }
                    });
                });

                document.addEventListener('keydown', function(e) {
                    if (e.key === 'l' || e.key === 'L') {
                        e.preventDefault();
                        btnLocate.click();
                    }
                    if (e.key === 'r' || e.key === 'R') {
                        e.preventDefault();
                        btnReset.click();
                    }
                });
            }

            // ---------- 启动 ----------
            function init() {
                setStatus(false, '加载中…');
                loadingMask.classList.remove('hidden');

                if (typeof AMap !== 'undefined') {
                    initMap();
                } else {
                    let attempts = 0;
                    const checkAMap = setInterval(function() {
                        attempts++;
                        if (typeof AMap !== 'undefined') {
                            clearInterval(checkAMap);
                            initMap();
                        } else if (attempts > 20) {
                            clearInterval(checkAMap);
                            loadingMask.classList.add('hidden');
                            setStatus(false, 'API 加载超时');
                            console.error('高德 API 加载超时');
                        }
                    }, 300);
                }

                bindEvents();
            }

            if (document.readyState === 'complete') {
                init();
            } else {
                window.addEventListener('load', init);
            }

        })();
    </script>

</body>
</html>
